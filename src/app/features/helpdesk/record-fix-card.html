<ar-card heading="Record the fix">
  <p class="rf__muted">
    Before closing: what code did the machine show, what was really wrong, and what fixed it.
  </p>
  <label class="ar-field">
    <span class="ar-field__label">Code seen</span>
    <input
      class="ar-field__input"
      maxlength="32"
      [disabled]="!canEdit()"
      [value]="code()"
      (input)="code.set($any($event.target).value)"
    />
  </label>
  <label class="ar-field">
    <span class="ar-field__label">Real cause</span>
    <textarea
      class="ar-field__input"
      rows="2"
      maxlength="1000"
      [disabled]="!canEdit()"
      [value]="cause()"
      (input)="cause.set($any($event.target).value)"
    ></textarea>
  </label>
  <label class="ar-field">
    <span class="ar-field__label">What fixed it</span>
    <textarea
      class="ar-field__input"
      rows="2"
      maxlength="1000"
      [disabled]="!canEdit()"
      [value]="fix()"
      (input)="fix.set($any($event.target).value)"
    ></textarea>
  </label>
  <label class="ar-field">
    <span class="ar-field__label">Spares used <span class="ar-field__opt">part numbers</span></span>
    <input
      class="ar-field__input"
      maxlength="500"
      [disabled]="!canEdit()"
      [value]="spares()"
      (input)="spares.set($any($event.target).value)"
    />
  </label>
  @if (canEdit()) {
    <button ar-button type="button" [disabled]="busy()" (click)="save()">Save the fix</button>
  }
</ar-card>
