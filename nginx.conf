server {
    listen 80;
    server_name _;
    # Preserve ABP's __tenant workspace header when forwarding /api/ requests.
    underscores_in_headers on;
    root /usr/share/nginx/html;
    index index.html;

    # Stable entry points must revalidate after a release. Only fingerprinted
    # bundles below are safe to cache as immutable for a year.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }
    location = /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }
    location = /field-sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Long-cache the fingerprinted bundles, never the shell.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy the API so the SPA and the backend are same-origin in the container stack.
    location /api/ {
        # ${API_UPSTREAM}: filled in when the container starts (see the Dockerfile).
        proxy_pass ${API_UPSTREAM};
        proxy_http_version 1.1;
        # The API's own host name: the load balancer routes by it, so the browser's host would not reach the API.
        proxy_set_header Host $proxy_host;
        # When the upstream is https://, name the API in the TLS handshake too (SNI).
        proxy_ssl_server_name on;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SignalR needs the connection upgraded.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 100s;
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
