name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Format check
        run: npx prettier --check "src/**/*.{ts,html,scss}"

      # The API proxies are hand-written: every route they call must exist in the API's published routes
      # (src/app/proxy/api-routes.snapshot.json, refreshed with --refresh <api url> when the API changes).
      - name: Proxy routes
        run: node scripts/check-proxy-routes.mjs

      - name: Build
        run: npx ng build --configuration production

      - name: Unit tests
        run: npx ng test --watch=false
