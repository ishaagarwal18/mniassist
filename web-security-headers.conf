# Included in every static location: nginx add_header inheritance stops at locations with their own cache headers.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options $ar_frame_options always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Browsers honor HSTS only over HTTPS; TLS terminates at the load balancer.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self)" always;
# Preserve Syncfusion templates, inline theme bootstrap, captcha, provider SDKs, payment frames and call media.
# A nonce-based script policy needs a separate template/SDK migration; do not silently break those features here.
add_header Content-Security-Policy "default-src 'self' https: data: blob:; script-src 'self' https: 'unsafe-inline' 'unsafe-eval'; style-src 'self' https: 'unsafe-inline'; connect-src 'self' https: wss:; object-src 'none'; base-uri 'self'; frame-ancestors $ar_frame_ancestors; form-action 'self' https:; worker-src 'self' blob: data:" always;
